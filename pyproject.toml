[project]
name = "telegram-broadcast-bot"
version = "1.0.0"
description = "Telegram Broadcast Bot with Vercel + Supabase + Redis + Persistent Worker"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "aiogram>=3.4.0",
    "fastapi>=0.109.0",
    "supabase>=2.3.0",
    "telethon>=1.34.0",
    "upstash-redis>=1.0.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.uv]
dev-dependencies = []
