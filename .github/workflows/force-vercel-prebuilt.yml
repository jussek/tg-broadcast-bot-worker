name: Force Vercel Prebuilt Production Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-vercel-prebuilt.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is missing" && exit 2)

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip uv
          npm install --global vercel@latest

      - name: Link project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_1jFI8sNieDWR8ww8MwpjdtOS","projectId":"prj_2EA4P6Oey11QThgEkVa8lPFAYzYI"}' > .vercel/project.json

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build locally for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
