name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile deployment entrypoint
        run: python -m py_compile api/index.py
      - name: Run test suite
        env:
          API_ID: ""
          API_HASH: ""
          TELEGRAM_SESSION_STRING: ""
          BOT_TOKEN: ""
        run: pytest -q
